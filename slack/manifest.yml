# Slack app for EMS People & Culture.
# In Slack: api.slack.com/apps → Create New App → From an app manifest → pick the EMS workspace → paste this.
# If the site moves (e.g. people.ems-itech.com), update the url below.
display_information:
  name: EMS Clock
  description: Clock in, breaks and clock out for EMS, straight from Slack.
  background_color: "#1f3201"
features:
  bot_user:
    display_name: ems-clock
    always_online: false
  slash_commands:
    - command: /ems
      url: https://hr-navy-zeta.vercel.app/api/slack/commands
      description: Clock in, break, back, out, status
      usage_hint: in | break | back | out | status
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - users:read
      - users:read.email
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
