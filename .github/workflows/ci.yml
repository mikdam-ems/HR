# Runs the same checks a contributor runs before pushing (see AGENTS.md), on every pull request
# and on every push to the main branch, so nothing reaches the pilot without them.
name: Checks

on:
  pull_request:
  push:
    branches: [claude/practical-volta-vfybbj]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (rules engine + in-memory database)
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Walk through a week at EMS (e2e/walkthrough.e2e.ts)
        run: npm run test:e2e
      # When it fails: the screenshot of the page it failed on, and the HTML report.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
