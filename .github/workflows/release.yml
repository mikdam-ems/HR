# Publishes release notes. When the newest version in CHANGELOG.md (the first "## vX.Y.Z" heading) has no GitHub
# Release yet, this creates one: tagged on the main branch, with that version's section as its notes.
# So shipping a batch is one pull request that turns "Unreleased" into a version (see docs/HOW_WE_WORK.md).
name: Release notes

on:
  push:
    branches: [claude/practical-volta-vfybbj]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-notes
  cancel-in-progress: false

jobs:
  release:
    name: Publish the newest version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the newest version from CHANGELOG.md
        id: notes
        run: |
          heading=$(grep -m1 -E '^## v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md || true)
          if [ -z "$heading" ]; then echo "No released version in CHANGELOG.md yet."; exit 0; fi
          version=$(echo "$heading" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')
          # The section runs from its heading to the next "## " heading.
          awk -v h="$heading" '$0 == h { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md > notes.md
          # One number everywhere (docs/decisions/0004): package.json must match the changelog.
          app=$(node -p "require('./package.json').version")
          if [ "v$app" != "$version" ]; then
            echo "::error::CHANGELOG.md says $version but package.json says $app. Bump package.json in the same pull request."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "title=${heading#\#\# }" >> "$GITHUB_OUTPUT"

      - name: Create the release if it doesn't exist
        if: steps.notes.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.notes.outputs.version }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "$VERSION is already published."
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md
          fi
