name: Feature
description: Something new the app should do.
labels: [feature]
body:
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Who needs this and what problem it solves for them today.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What
      description: What the feature does, in plain words. Screens or rules it touches.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A checklist anyone can test in the app. Include Arabic and both brands (EMS, Kadr) where the UI changes.
      value: |
        - [ ] 
        - [ ] Works in Arabic (right to left)
        - [ ] Works in the EMS and Kadr brands
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      options: [S (a day or two), M (about a week), L (needs splitting)]
